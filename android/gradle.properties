# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Some Capacitor plugins (e.g. @capacitor/filesystem) declare a JDK 21 toolchain.
# This machine has no toolchain auto-download configured, so both JDKs it has
# installed are listed here for Gradle to pick from.
org.gradle.java.installations.paths=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.101-hotspot,C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.101-hotspot
